name: Kernel Build

on:
  workflow_dispatch:  # ✅ Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_DIR: kernel_source
      PATCH_DIR: patches
      OUT_DIR: out
      ARCH: arm64

    steps:
      - name: 🧬 Clone Repository
        uses: actions/checkout@v4  # ✅ Ensures patches are available

      - name: 🧬 Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/biki786-rgb/android_kernel_oplus_RMX1921-base.git $KERNEL_DIR

      - name: 🩹 Apply Patches
        run: |
          if ls $PATCH_DIR/*.patch 1> /dev/null 2>&1; then
            for patch in $PATCH_DIR/*.patch; do
              if ! git -C $KERNEL_DIR apply "$patch"; then
                echo "❌ Failed to apply patch: $patch"
                exit 1
              fi
            done
            echo "✅ All patches applied successfully."
          else
            echo "❌ No patch files found in $PATCH_DIR."
            exit 1
          fi

      - name: ⚙️ Build Kernel
        run: |
          cd $KERNEL_DIR
          make O=../$OUT_DIR ARCH=$ARCH your_defconfig
          make O=../$OUT_DIR ARCH=$ARCH -j$(nproc)

      - name: 📦 Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Flashable-ZIP
          path: $OUT_DIR/arch/arm64/boot/Image.gz-dtb
