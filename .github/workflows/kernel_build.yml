name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential clang python3 git zip

      - name: Setup toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchains

      - name: Apply patches
        run: |
          cd kernel
          git apply ../patches/*.patch

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=../toolchains/bin/aarch64-linux-gnu-
          make O=out vendor/RMX1921_defconfig
          make -j$(nproc) O=out

      - name: Prepare AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp -r prebuilt_modules/ AnyKernel3/modules/
          cd AnyKernel3
          zip -r RealmeXT_Optimized_Kernel.zip * -x .git README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealmeXT-Kernel
          path: AnyKernel3/RealmeXT_Optimized_Kernel.zip